<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7f8fa">
  <title>FlowStock</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <div id="loading" class="loading"><div class="spinner"></div><span>กำลังโหลด FlowStock…</span></div>
  <main id="authView" class="auth-shell hidden">
    <section class="login-card">
      <div class="logo-mark">FS</div><h1>FlowStock</h1>
      <p class="subtitle">Sales • Stock • Delivery • Profit</p>
      <form id="loginForm" autocomplete="on">
        <label>อีเมล<input id="email" type="email" autocomplete="username" required placeholder="name@company.com"></label>
        <label>รหัสผ่าน<input id="password" type="password" autocomplete="current-password" minlength="6" required></label>
        <button class="btn primary wide" type="submit">เข้าสู่ระบบ</button>
        <p id="loginError" class="error" role="alert"></p>
      </form>
      <button id="signupBtn" class="btn wide" type="button">ขอสร้างบัญชีผู้ใช้</button>
      <form id="signupForm" class="hidden">
        <label>ชื่อ-นามสกุล<input id="signupName" required></label>
        <label>รหัสพนักงาน<input id="signupEmployee"></label>
        <label>หน้าที่<select id="signupRole"><option value="SALES">ฝ่ายขาย</option><option value="WAREHOUSE">คลังสินค้า</option><option value="LOGISTICS">ขนส่ง</option><option value="OWNER">ผู้บริหาร</option></select></label>
        <label>อีเมล<input id="signupEmail" type="email" required></label>
        <label>รหัสผ่าน<input id="signupPassword" type="password" minlength="6" required></label>
        <button class="btn primary wide" type="submit">ส่งคำขอเปิดใช้งาน</button>
        <button id="backLoginBtn" class="btn wide" type="button">กลับหน้า Login</button>
        <p id="signupError" class="error" role="alert"></p>
      </form>
      <section id="pendingView" class="hidden">
        <div class="alert warn">คำขอเปิดใช้งานถูกส่งแล้ว กรุณารอ Admin อนุมัติ</div>
        <button id="pendingLogoutBtn" class="btn wide">ออกจากระบบ</button>
      </section>
      <p class="login-note">บัญชีผู้ใช้และสิทธิ์กำหนดโดยผู้ดูแลระบบ</p>
    </section>
  </main>
  <div id="shell" class="shell hidden">
    <aside id="sidebar" class="sidebar">
      <div class="brand"><span class="logo-mark small">FS</span><span><b>FlowStock</b><small>Sales • Stock • Delivery • Profit</small></span></div>
      <nav id="nav"></nav>
      <div class="side-foot"><span id="sideUser"></span><button id="logoutBtn" class="text-btn">ออกจากระบบ</button></div>
    </aside>
    <section class="workspace">
      <header class="topbar">
        <button id="menuBtn" class="icon-btn" aria-label="เปิดเมนู">☰</button>
        <div><b id="companyName">FlowStock</b><small id="roleName"></small></div>
        <button id="refreshBtn" class="btn ghost small-btn">↻ รีเฟรช</button>
      </header>
      <main id="page" class="page"></main>
    </section>
  </div>
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card"><button id="modalClose" class="modal-close" aria-label="ปิด">×</button><div id="modalBody"></div></div>
  </div>
  <div id="toast" class="toast" aria-live="polite"></div>
</body>
</html>

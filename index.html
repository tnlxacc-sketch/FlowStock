<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7f8fa">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; connect-src 'self' https://ifanefgaiuzkbjtttiqn.supabase.co wss://ifanefgaiuzkbjtttiqn.supabase.co; img-src 'self' data: blob:; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
  <title>FlowStock</title>
  <link rel="stylesheet" href="styles.css?v=1.13.0">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
  <script defer src="app.js?v=1.13.2"></script>
</head>
<body>
  <div id="loading" class="loading"><div class="spinner"></div><span>กำลังโหลด FlowStock…</span></div>
  <main id="authView" class="auth-shell hidden">
    <section class="login-card">
      <div class="logo-mark">FS</div><h1>FlowStock</h1>
      <p class="subtitle">Sales • Stock • Delivery • Profit</p>
      <form id="loginForm" autocomplete="on">
        <label>อีเมล<input id="email" type="email" autocomplete="username" required placeholder="name@company.com"></label>
        <label>รหัสผ่าน<input id="password" type="password" autocomplete="current-password" minlength="8" required></label>
        <button class="btn primary wide" type="submit">เข้าสู่ระบบ</button>
        <button id="forgotBtn" class="text-btn auth-link" type="button">ลืมรหัสผ่าน / ขอรหัสใหม่จาก Admin</button>
        <p id="loginError" class="error" role="alert"></p>
      </form>
      <div class="alert info login-admin-only">ระบบนี้ให้ผู้ดูแลบริษัทสร้างบัญชีผู้ใช้เท่านั้น<br>หากยังไม่มีบัญชี กรุณาติดต่อ Admin บริษัท</div>
      <p class="login-note">บัญชีผู้ใช้และสิทธิ์กำหนดโดยผู้ดูแลระบบ</p>
    </section>
  </main>
  <div id="shell" class="shell hidden">
    <header class="topbar">
      <button id="menuBtn" class="icon-btn" aria-label="เปิดเมนู">☰</button>
      <div class="brand"><b>FlowStock</b><small>Sales • Stock • Delivery • Profit</small></div>
      <div class="top-company"><b id="companyName">FlowStock</b><small id="sideUser"></small></div>
      <span id="roleName" class="role-chip"></span>
      <button id="refreshBtn" class="btn ghost small-btn">↻ รีเฟรช</button>
    </header>
    <div class="app-body">
      <aside id="sidebar" class="sidebar">
        <nav id="nav"></nav>
        <div class="side-foot"><button id="logoutBtn" class="text-btn">ออกจากระบบ</button></div>
      </aside>
      <section class="workspace"><main id="page" class="page"></main></section>
    </div>
  </div>
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card"><button id="modalClose" class="modal-close" aria-label="ปิด">×</button><div id="modalBody"></div></div>
  </div>
  <div id="toast" class="toast" aria-live="polite"></div>
</body>
</html>
